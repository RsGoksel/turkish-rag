[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "turkish-rag"
version = "0.1.0"
description = "Turkce icin retrieval (Mursit-Large-TR-Retrieval + ChromaDB). LLM yok."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Goksu" }]
keywords = ["rag", "turkish", "nlp", "retrieval", "embedding"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Natural Language :: Turkish",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "torch>=2.3",
    "sentence-transformers>=3.0",
    "chromadb>=0.5",
    "numpy>=1.26",
    "huggingface_hub>=0.24",
    "hf_transfer>=0.1.6",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.30", "pydantic>=2.0"]
dev = ["pytest>=8.0", "ruff>=0.5"]
all = ["turkish-rag[api,dev]"]

[project.urls]
Source = "https://github.com/RsGoksel/Turkish-RAG"
"LLM Variant" = "https://github.com/RsGoksel/Turkish-LLM-RAG"

[project.scripts]
turkish-rag = "turkish_rag.cli:main"

[tool.setuptools.packages.find]
include = ["turkish_rag*"]
